name: Normalize owned Rust formatting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-rust.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: normalize-rust-${{ github.repository }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Checkout pinned sibling
        run: python3 scripts/ci-checkout.py
      - name: Select pinned toolchain
        run: rustup show active-toolchain
      - name: Normalize and publish a coherent formatting checkpoint
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          python3 scripts/format-owned.py
          python3 scripts/format-owned.py --check
          if ! git diff --quiet; then
            BASE_REVISION="$base" python3 - <<'PY'
          import os, pathlib, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          changed = [name for name in changed if name]
          if any(not name.startswith('crates/') or not name.endswith('.rs') for name in changed):
              raise SystemExit('Refusing unexpected non-format source changes')
          evidence = pathlib.Path('.agnir/evidence') / ('release-rustfmt-' + os.environ['GITHUB_RUN_ID'] + '.md')
          evidence.write_text('# Owned Rust formatting checkpoint\n\nBaseline: `' + os.environ['BASE_REVISION'] + '`\n\nNormalized all owned workspace members with the pinned toolchain and verified `scripts/format-owned.py --check`. Sibling sources were not modified. This is formatting evidence only; compile, tests, security and release acceptance remain separate gates. Project identity and selected lineage are unchanged.\n\nChanged sources:\n' + ''.join('- `' + name + '`\n' for name in changed))
          subprocess.run(['git', 'add', '--', *changed, str(evidence)], check=True)
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            current=$(git ls-remote origin refs/heads/main | cut -f1)
            test "$current" = "$base" || { echo 'AGNIR_CHECKPOINT_CONFLICT'; exit 1; }
            git commit -m 'style(release): normalize owned Rust sources'
            git push origin HEAD:main
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          fi
          echo "Validated formatting revision: $(git rev-parse HEAD)"
      - name: Run acceptance CI on the published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
