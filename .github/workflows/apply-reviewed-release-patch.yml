name: Apply reviewed release quality checkpoint
on:
  push:
    branches: ['release/lint-1.0.0']
permissions:
  contents: read
concurrency:
  group: reviewed-release-checkpoint
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed input and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd().resolve()
          request = '.release-request/lint-1.0.0/'
          workflow = '.github/workflows/apply-reviewed-release-patch.yml'
          transport = [request + 'manifest.json', request + 'change.patch.gz.b64', workflow]
          spec = json.loads((root / transport[0]).read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', spec['base']):
              raise SystemExit('Invalid baseline revision')
          subprocess.run(['git', 'merge-base', '--is-ancestor', spec['base'], 'HEAD'], check=True)
          if git('ls-remote', 'origin', 'refs/heads/main').split()[0] != spec['base']:
              raise SystemExit('AGNIR_CHECKPOINT_CONFLICT: main advanced')
          if set(git('diff', '--name-only', spec['base'], 'HEAD').splitlines()) != set(transport):
              raise SystemExit('Unexpected request source changes')
          encoded = (root / transport[1]).read_text().strip()
          if len(encoded) > 200000:
              raise SystemExit('Oversized patch transport')
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded, validate=True))) as stream:
              patch = stream.read(1000001)
          if len(patch) > 1000000 or hashlib.sha256(patch).hexdigest() != spec['patch_sha256']:
              raise SystemExit('Reviewed patch checksum mismatch')
          files = spec['files']
          paths = [entry['path'] for entry in files]
          if len(paths) != len(set(paths)) or not paths:
              raise SystemExit('Invalid reviewed path set')
          def verify(entry, phase):
              relative = pathlib.PurePosixPath(entry['path'])
              if relative.is_absolute() or '..' in relative.parts or not relative.parts or relative.parts[0] == '.git':
                  raise SystemExit('Unsafe reviewed path')
              path = root / relative
              if path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise SystemExit('Symlink or source-boundary violation')
              expected = entry[phase]
              if expected is None:
                  if path.exists():
                      raise SystemExit(f'Expected absent path: {relative}')
              elif not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'{phase} hash mismatch: {relative}')
          for entry in files:
              verify(entry, 'before')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '-'], input=patch, check=True)
          for entry in files:
              verify(entry, 'after')
          if set(git('diff', '--cached', '--name-only').splitlines()) != set(paths):
              raise SystemExit('Patch changed an unreviewed path')
          # Publish source only with Actions; workflow edits use the authorized connector separately.
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '--', '.github/workflows'], check=True)
          subprocess.run(['git', 'rm', '--', *transport[:2]], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          expected = {path for path in paths if not path.startswith('.github/workflows/')} | set(transport[:2])
          if set(git('diff', '--cached', '--name-only').splitlines()) != expected:
              raise SystemExit('Unexpected source publication paths')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-release-message.txt').write_text(spec['message'] + '\n')
          print('Verified reviewed patch:', spec['patch_sha256'])
          print('Changed paths:', len(paths))
          PY
      - name: Publish checkpoint to preparation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          current=$(git ls-remote origin refs/heads/release/lint-1.0.0 | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'AGNIR_CHECKPOINT_CONFLICT'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F "$RUNNER_TEMP/reviewed-release-message.txt"
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/release/lint-1.0.0
          published=$(git ls-remote origin refs/heads/release/lint-1.0.0 | cut -f1)
          test "$published" = "$(git rev-parse HEAD)"
          printf 'Verified preparation commit: `%s`\n\nMain was not changed by this workflow. Acceptance CI is required after explicit fast-forward promotion.\n' "$published" >> "$GITHUB_STEP_SUMMARY"
